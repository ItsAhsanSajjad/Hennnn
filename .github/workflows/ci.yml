name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: pakhen_test
          POSTGRES_USER: pakhen
          POSTGRES_PASSWORD: pakhen_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pakhen -d pakhen_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pakhen:pakhen_test_password@localhost:5432/pakhen_test?schema=public
      DIRECT_DATABASE_URL: postgresql://pakhen:pakhen_test_password@localhost:5432/pakhen_test?schema=public
      AUTH_SECRET: ci-auth-secret-change-before-production-123
      PRODUCT_MODE: DEMO
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:migrate:status
      - run: pnpm prisma migrate diff --exit-code --from-config-datasource --to-schema=prisma/schema.prisma
      - run: pnpm db:seed
      - run: pnpm db:seed
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm test:concurrency
      - run: pnpm build
      - run: pnpm reconcile:phase3
      - run: pnpm audit

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: pakhen_e2e
          POSTGRES_USER: pakhen
          POSTGRES_PASSWORD: pakhen_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pakhen -d pakhen_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pakhen:pakhen_e2e_password@localhost:5432/pakhen_e2e?schema=public
      DIRECT_DATABASE_URL: postgresql://pakhen:pakhen_e2e_password@localhost:5432/pakhen_e2e?schema=public
      AUTH_SECRET: ci-auth-secret-change-before-production-456
      PRODUCT_MODE: DEMO
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      PLAYWRIGHT_PORT: 3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:migrate:status
      - run: pnpm db:seed
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
